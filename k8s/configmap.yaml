apiVersion: v1
kind: ConfigMap
metadata:
  name: asman-config
data:
  LLM_PROVIDER: "deepseek"
  LLM_BASE_URL: "https://api.deepseek.com/v1"
  # PostgreSQL DSN（多实例共享状态 → 水平扩展的关键）
  DSN: "postgres://asman:asman@postgres:5432/asman"
  PLAN: "pro"
  WORKER_MODE: "local"
  WORKER_CONCURRENCY: "5"
  MAX_CONCURRENT_TASKS: "3"
